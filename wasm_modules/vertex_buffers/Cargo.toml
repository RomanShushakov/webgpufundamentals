[package]
name = "vertex_buffers"
version.workspace = true
authors.workspace = true
edition.workspace = true


[lib]
crate-type = ["cdylib"]


[dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "GpuDevice",
    "GpuCanvasContext",
    "GpuTextureFormat",
    "GpuShaderModuleDescriptor",
    "GpuShaderModule",
    "GpuVertexState",
    "GpuColorTargetState",
    "GpuFragmentState",
    "GpuRenderPipelineDescriptor",
    "GpuRenderPipeline",
    "GpuRenderPassColorAttachment",
    "GpuLoadOp",
    "GpuStoreOp",
    "GpuColorDict",
    "GpuRenderPassDescriptor",
    "GpuTexture",
    "GpuTextureView",
    "GpuCommandEncoder",
    "GpuRenderPassDescriptor",
    "GpuRenderPassEncoder",
    "GpuCommandBuffer",
    "GpuQueue",
    "GpuBufferDescriptor",
    "GpuBuffer",
    "gpu_buffer_usage",
    "HtmlCanvasElement",
    "GpuVertexBufferLayout",
    "GpuVertexAttribute",
    "GpuVertexFormat",
    "GpuVertexStepMode",
    "GpuIndexFormat",
] }

js-sys.workspace = true

rand = "0.9.2"
getrandom = { version = "0.3.4", features = ["wasm_js"] }

